AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: My Shop - products API, React frontend hosting, and monitoring

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives Lambda and API error alerts

Globals:
  Function:
    Runtime: nodejs24.x          # if sam validate/build rejects this, use nodejs22.x
    Architectures: [x86_64]
    MemorySize: 128
    Timeout: 10
    LoggingConfig:
      LogFormat: JSON

Resources:
  # ---------------- Database ----------------
  ProductsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain          # keep product data if the stack is ever deleted
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # ---------------- API + Lambda ----------------
  ProductsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${FrontendDistribution.DomainName}"
          - http://localhost:5173
          - http://localhost:5174
        AllowMethods: [GET]
        AllowHeaders: [content-type]
        MaxAge: 300

  GetProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/functions/getProducts/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt ProductsTable.Arn
      Events:
        GetProducts:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProductsApi
            Path: /products
            Method: GET

  # ---------------- Frontend hosting ----------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-frontend-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: My Shop frontend
        DefaultRootObject: index.html
        IPV6Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        # React Router support: unknown paths fall back to index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  # ---------------- Monitoring ----------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: My Shop alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-errors"
      AlarmDescription: Errors in the products Lambda
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GetProductsFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx-errors"
      AlarmDescription: 5xx responses from the products API
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ProductsApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API (use as VITE_API_URL; routes are under /products)
    Value: !Sub "https://${ProductsApi}.execute-api.${AWS::Region}.amazonaws.com"
  FrontendUrl:
    Description: CloudFront URL of the React app
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Description: Upload the React build output here
    Value: !Ref FrontendBucket
  DistributionId:
    Description: Used for cache invalidation after frontend deploys
    Value: !Ref FrontendDistribution
  ProductsTableName:
    Description: New DynamoDB table name
    Value: !Ref ProductsTable